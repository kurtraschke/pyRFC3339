[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pyRFC3339"
dynamic = ["version"]
requires-python = ">= 3.11"
authors = [
    { name = "Kurt Raschke", email = "kurt@kurtraschke.com" }
]
description = "Generate and parse RFC 3339 timestamps"
readme = { file = "README.rst", content-type = "text/x-rst" }
keywords = ["rfc-3339", "timestamp", "iso-8601", "datetime"]
license = "MIT"
license-files = ["LICENSE.txt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet"
]

[project.urls]
Homepage = "https://github.com/kurtraschke/pyrfc3339"
Documentation = "https://pyrfc3339.readthedocs.io/"
Repository = "https://github.com/kurtraschke/pyRFC3339.git"
"Bug Tracker" = "https://github.com/kurtraschke/pyRFC3339/issues"
Changelog = "https://github.com/kurtraschke/pyRFC3339/blob/main/CHANGES.rst"

[tool.setuptools]
packages = ["pyrfc3339"]

[tool.setuptools_scm]

[tool.mypy]
strict = true

[tool.coverage.run]
omit = ["pyrfc3339/tests/*"]

[tool.tox]
requires = ["tox>=4"]
env_list = ["ruff-lint", "type", "ruff-format", "3.11", "3.12", "3.13", "3.14", "3.15"]
skip_missing_interpreters = true

[tool.tox.gh.python]
"3.15" = ["ruff-lint", "type", "ruff-format", "3.15"]
"3.14" = ["3.14"]
"3.13" = ["3.13"]
"3.12" = ["3.12"]
"3.11" = ["3.11"]

[tool.tox.env_run_base]
deps = ["pytest", "pytest-subtests", "pytest-cov", "tzdata;platform_system==\"Windows\""]
commands = [["pytest",
    "--doctest-glob=docs/source/*.rst",
    "--doctest-glob=README.rst",
    "--doctest-modules",
    "--doctest-continue-on-failure",
    "--cov=pyrfc3339",
    "."]]

[tool.tox.env.type]
skip_install = true
deps = ["mypy"]
commands = [["mypy", "pyrfc3339"]]

[tool.tox.env.ruff-lint]
skip_install = true
deps = ["ruff"]
commands = [["ruff", "check", "."]]

[tool.tox.env.ruff-format]
skip_install = true
deps = ["ruff"]
commands = [["ruff", "format", "--check", "--diff", "."]]

[tool.tox.env.docs]
deps = ["-r docs/requirements.txt"]
commands = [["sphinx-build", "-M", "html", "docs/source", "docs/build"]]